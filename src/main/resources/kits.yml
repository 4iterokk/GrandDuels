# Kits. Each item is either a structured definition (below) or a lossless serialized item written by /duels savekit:
#   { material: DIAMOND_SWORD, amount: 1, data: <base64 produced by ItemStack#serializeAsBytes> }  (data wins when present)
#
# Structured item keys:
#   material, amount, name, lore, enchantments {<minecraft key>: level}, unbreakable, damage,
#   potion {type: <potion type>, effects: [{type, duration, amplifier}]},
#   trim {pattern, material},
#   attribute-modifiers: [{attribute, amount, operation: ADD_NUMBER|ADD_SCALAR|MULTIPLY_SCALAR_1, slot: mainhand|offhand|head|chest|legs|feet|any}]
#   components (Paper DataComponentTypes): max-stack-size, max-damage,
#       food {nutrition, saturation, can-always-eat}, consumable {consume-seconds}
#
# ranked: / unranked: (true or false, default true) choose in which queue the kit can be picked. A kit set to false
# is hidden from that queue's menu and players waiting for it are removed - handy to disable a kit temporarily
# without deleting it. Friendly duels and arena mode are not affected.
#   ranked: false     -> not available in Ranked
#   unranked: false   -> not available in Unranked
#
# display-name and description may be given per language, keyed by the language code of config.yml (the active
# language is used, then en, then the first one listed):
#   description:
#     en: [ "&7Classic potion PvP." ]
#     ru: [ "&7Классический PvP с зельями." ]
#
# Slots: items 0-8 hotbar, 9-35 inventory. armor: helmet/chestplate/leggings/boots. offhand: single item.
# Status effects: effects: [{type: speed, duration: 999999, amplifier: 0}]  (duration -1 = infinite)

kits:
  nodebuff:
    display-name: "&#ff5555&lNoDebuff"
    icon: SPLASH_POTION
    ranked: true
    unranked: true
    description:
