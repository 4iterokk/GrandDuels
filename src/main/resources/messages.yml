    - "&6&l{player}&7's duel stats"
    - "&7Wins: &f{wins} &8| &7Losses: &f{losses}"
    - "&7Kills: &f{kills} &8| &7Deaths: &f{deaths} &8| &7K/D: &f{kd}"
