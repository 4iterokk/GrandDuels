# GrandDuels messages. Supports &a legacy codes, &#RRGGBB / <#RRGGBB> hex and <gradient:#aaaaaa:#bbbbbb>text</gradient>.
# Placeholders look like {player}. Placeholder values are plain text from the plugin.

prefix: "&8[&#ff5555Grand&#ffaa00Duels&8] &7"

general:
  player-only: "&cThis command can only be used by players."
  no-permission: "&cYou do not have permission to do that."
  unknown-subcommand: "&cUnknown subcommand. Available: &f{commands}"
  player-not-found: "&cPlayer &f{player} &cis not online."
  invalid-name: "&cNames may only contain letters, numbers, '_' and '-' (max 32 characters)."

duels:
  usage: "&7Usage: &f/duel <player> &8| &f/duel accept|deny [player] &8| &f/duel cancel &8| &f/duel cooldowns &8| &f/duel stats [player]"
  cannot-self: "&cYou cannot duel yourself."
  self-busy: "&cYou are already in a duel."
  target-busy: "&f{player} &cis already in a duel."
  player-busy: "&cOne of the players is already in a duel."
  already-sent: "&cYou already have a pending request. Use &f/duel cancel &cfirst."
  request-sent: "&7Duel request sent to &f{target} &7(kit &f{kit}&7). It expires in &f{seconds}s&7."
  request-received: "&f{sender} &7challenged you to a duel! Kit: &f{kit} &8| &7Custom cooldowns: &f{cooldowns} &8(&7{seconds}s&8)"
  request-accept-button: "&a&l[ACCEPT]"
  request-deny-button: "&c&l[DENY]"
  request-accept-hover: "&7Click to accept the duel"
  request-deny-hover: "&7Click to deny the duel"
  request-expired: "&7Your duel request to &f{target} &7expired."
  request-expired-target: "&7The duel request from &f{sender} &7expired."
  request-cancelled-target: "&f{sender} &7cancelled the duel request."
  cancelled: "&7You cancelled your duel request to &f{target}&7."
  cancel-none: "&cYou have no pending duel request."
  none-pending: "&cYou have no pending duel requests."
  multiple-pending: "&cMultiple requests pending. Specify one: &f{players}"
  request-not-found: "&cNo pending request from that player."
  declined: "&f{player} &7declined your duel request."
  decline-confirm: "&7You declined the duel request from &f{player}&7."
  starting: "&7Duel against &f{opponent} &7on arena &f{arena} &7with kit &f{kit}&7."
  opponent-left: "&f{opponent} &7left the duel."
  summary: "&7You dealt &f{damage} &7damage, your opponent dealt &f{opponent_damage}&7."
  ongoing: "&7vs &f{opponent} &8| &c{health}\u2764 &8| &f{time}"
  command-blocked: "&cYou cannot use commands during a duel."
  elo-gain: "&7Ranked rating: &a+{amount}"
  elo-loss: "&7Ranked rating: &c-{amount}"
  item-banned: "&cThis item is banned in this duel."
  banned-word: "banned"
  no-rules-word: "default"
  request-details: "&7Rules: &f{details}"
  item-blocked: "&cYou cannot drop or pick up items during a duel."
  elytra-blocked: "&cElytra are disabled during duels."
  riptide-blocked: "&cRiptide is disabled during duels."
  start-failed: "&cThe duel could not be started. Nothing was changed."
  recovered: "&7Your inventory and location were restored after an interrupted duel."
  state-on: "&aON"
  state-off: "&cOFF"

modes:
  friendly: "Friendly"
  unranked: "Unranked"
  ranked: "Ranked"

queue:
  joined: "&7You joined the &f{mode} &7queue for &f{kit}&7. Leave with &f/duel leave&7."
  left: "&7You left the queue."
  not-queued: "&cYou are not in a queue."
  busy: "&cYou cannot queue right now."
  standard-only: "&cOnly standard kits can be queued."
  kit-removed: "&cThe kit you queued for no longer exists. You were removed from the queue."
  searching: "&7Searching &f{mode} &7match &8| &f{kit} &8| &f{time}"
  searching-ranked: "&7Searching &f{mode} &7match &8| &f{kit} &8| &f{time} &8| &f{elo} ELO &7(±&f{range}&7)"
  joined-ranked: "&7You joined the &fRanked &7queue for &f{kit}&7. Rating: &f{elo} ELO&7, matching within &f±{range}&7 (widens while you wait). Leave with &f/duel leave&7."
  found: "&7Opponent found: &f{opponent}"
  found-ranked: "&7Opponent found: &f{opponent} &8(&f{elo} ELO&8) &7- your rating: &f{own_elo}"

playerkits:
