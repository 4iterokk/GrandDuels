    back: "&7\u00ab Back to kits"
    cancel: "&cCancel"
  tags:
    mace: "&8\u2022 &7Mace"
    wind-charge: "&8\u2022 &7Wind Charges"
    trident: "&8\u2022 &7Trident"
    spear: "&8\u2022 &7Spear"
    wolf-armor: "&8\u2022 &7Wolf Armor"
    components: "&8\u2022 &7Data components: &f{components}"

scoreboard:
  title: "&#ff5555&lGrand&#ffaa00&lDuels"
  lines:
    - "&8&m                    "
    - "&7Kit: &f{kit}"
    - "&7Arena: &f{arena}"
    - "&7Time: &f{time}"
    - " "
    - "&f{player1}: &c{health1}\u2764"
    - "&f{player2}: &c{health2}\u2764"
    - "&8&m                    &r"

